<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>آخرین ایستگاه — PROJECT: ECHO</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="hud">
  <div class="panel title">🎮 آخرین ایستگاه <small>PROJECT: ECHO</small></div>
  <div class="panel mission"><b>مأموریت فعلی</b><div id="mission">اطراف خودرو را بررسی کنید.</div></div>
  <div class="panel inventory"><b>تجهیزات</b><div id="items">خالی</div></div>
  <div class="panel clues"><b>سرنخ‌ها</b><div id="clues">0 / 3</div></div>
  <div id="message" class="panel message"></div>
</div>
<div id="crosshair">+</div>
<div id="prompt"></div>
<div id="start">
  <div class="card">
    <h1>آخرین ایستگاه</h1>
    <p>فصل اول — ورود</p>
    <p>در یک جاده کوهستانی متروکه، پیام عجیبی از رادیو دریافت کرده‌اید.</p>
    <button id="startBtn">شروع بازی</button>
    <p class="controls">WASD حرکت · ماوس نگاه · E تعامل · Shift دویدن · Esc آزاد/قفل کردن ماوس</p>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
